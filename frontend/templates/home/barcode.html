<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Código de Barras - {{ user.fullname }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f2f4f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        .container h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .container p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .barcode-section {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 30px 20px;
            margin: 30px 0;
        }

        .barcode-section img {
            max-width: 100%;
            height: auto;
            display: inline-block;
            background: white;
            padding: 15px;
            border-radius: 8px;
        }

        .barcode-code {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        .user-info {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: left;
        }

        .user-info p {
            margin-bottom: 8px;
            color: #333;
        }

        .user-info strong {
            color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            flex: 1;
            min-width: 140px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e9ecef;
            color: #333;
            border: 1px solid #dee2e6;
        }

        .btn-secondary:hover {
            background: #dee2e6;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }

        .btn-info {
            background: #3b82f6;
            color: white;
        }

        .btn-info:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
        }

        .info-box {
            background: #fef3c7;
            border: 1px solid #fcd34d;
            color: #92400e;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 20px;
        }

        .back-link {
            margin-top: 20px;
            text-align: center;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .back-link a:hover {
            color: #5568d3;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                min-width: auto;
            }

            .container h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Meu código de barras</h1>
        <p>Identificação de colaborador</p>

        <div class="user-info">
            <p><strong>Nome:</strong> {{ user.fullname }}</p>
            <p><strong>Usuario:</strong> {{ user.username }}</p>
            <p><strong>Código:</strong> <span style="font-family: monospace; letter-spacing: 1px;">{{ user.barcode }}</span></p>
        </div>

        <div class="barcode-section">
            <img src="/home/barcode/view" alt="Código de Barras" id="barcode-img">
            <div class="barcode-code">{{ user.barcode }}</div>
        </div>

        <div class="button-group">
            <a href="/home/barcode/view" class="btn btn-primary" download="codigo_barras_{{ user.id }}.png">
                Baixar
            </a>
            <button class="btn btn-success" onclick="compartir()">
                Compartilhar
            </button>
            <button class="btn btn-info" onclick="copiarCodigo()">
                Copiar Codigo
            </button>
        </div>

        <div class="info-box">
            💡 <strong>Conselho:</strong> Baixe ou compatilhe este código con seus colaboradores para utilizar o stock
        </div>

        <div class="back-link">
            <a href="/inv/dashboard">&larr; Entrar no inventario</a>
        </div>
    </div>

    <script>
        function descargar() {
            const link = document.createElement('a');
            link.href = '/home/barcode/view';
            link.download = `codigo_barras_{{ user.username }}.png`;
            link.click();
        }

        function compartir() {
            if (navigator.share) {
                const barcodeImg = document.getElementById('barcode-img');
                
                // Convertir imagen a blob
                fetch(barcodeImg.src)
                    .then(response => response.blob())
                    .then(blob => {
                        const file = new File([blob], `codigo_barras_{{ user.username }}.png`, { type: blob.type });
                        navigator.share({
                            title: '🏷️ Meu Código de Barras',
                            text: 'Meu código de colaborador: {{ user.barcode }} - {{ user.fullname }}',
                            files: [file]
                        }).catch(err => {
                            if (err.name !== 'AbortError') {
                                console.error('Erro ao compartilhar:', err);
                                alert('Não foi possível compartilhar o código de barras');
                            }
                        });
                    })
                    .catch(err => {
                        console.error('Error:', err);
                        alert('Não foi possível processar o código');
                    });
            } else {
                // Fallback: Copiar a portapapeles
                const text = `Meu código de barras: {{ user.barcode }} - {{ user.fullname }}`;
                navigator.clipboard.writeText(text).then(() => {
                    alert('Código copiado com sucesso.');
                });
            }
        }

        function copiarCodigo() {
            const codigo = '{{ user.barcode }}';
            navigator.clipboard.writeText(codigo).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✅ ¡Copiado!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            }).catch(() => {
                alert('Não foi possível copiar o código.');
            });
        }
    </script>
</body>
</html>
